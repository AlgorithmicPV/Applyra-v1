{% extends "base.html" %}
{% block content %}
    <div class="error-container">
        <link rel="stylesheet"
              href="{{ url_for('static', filename='css/errors/common.css') }}">
        <h1 class="error-code">{{ error_code }}</h1>
        <h2 class="error-title">{{ error_title }}</h2>
        <p class="error-message">{{ error_message }}</p>
        <a href="{{ url_for("landing_web.landing") }}" class="error-home-btn">Back to Home</a>
    </div>
{% endblock %}
